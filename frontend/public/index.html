<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShortsAI — Auto YouTube Shorts Uploader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --card:      #16161f;
      --border:    #252535;
      --accent:    #6c47ff;
      --accent2:   #ff4764;
      --green:     #00e5a0;
      --yellow:    #ffcc00;
      --text:      #e8e8f0;
      --muted:     #6b6b8a;
      --font:      'Space Grotesk', sans-serif;
      --mono:      'JetBrains Mono', monospace;
      --radius:    12px;
      --shadow:    0 4px 32px rgba(0,0,0,0.5);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; width: 100%; }

    /* ── Header ───────────────────────────────────────────────────────────── */
    header {
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      padding: 16px 0;
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 700; color: var(--text);
      text-decoration: none;
    }
    .logo-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .logo span { color: var(--accent); }

    .user-pill {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 40px; padding: 6px 14px 6px 6px;
    }
    .user-pill img {
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
    }
    .user-pill-name { font-size: 13px; font-weight: 500; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius);
      font-family: var(--font); font-size: 14px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.18s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent); color: #fff;
      box-shadow: 0 0 24px rgba(108,71,255,0.3);
    }
    .btn-primary:hover {
      background: #7c5cff;
      box-shadow: 0 0 32px rgba(108,71,255,0.5);
      transform: translateY(-1px);
    }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
    .btn-danger {
      background: rgba(255,71,100,0.1); color: var(--accent2);
      border: 1px solid rgba(255,71,100,0.3);
    }
    .btn-danger:hover { background: rgba(255,71,100,0.2); }
    .btn-sm { padding: 6px 14px; font-size: 13px; }

    /* ── Hero / Login ─────────────────────────────────────────────────────── */
    .hero {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 80px 24px;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; top: -200px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(108,71,255,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(108,71,255,0.15); border: 1px solid rgba(108,71,255,0.3);
      color: #a88fff; padding: 6px 14px; border-radius: 40px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; margin-bottom: 28px;
    }
    .hero h1 {
      font-size: clamp(36px, 6vw, 64px); font-weight: 700;
      line-height: 1.1; margin-bottom: 20px; letter-spacing: -0.02em;
    }
    .hero h1 .grad {
      background: linear-gradient(135deg, #a88fff, var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 18px; color: var(--muted); max-width: 480px;
      margin: 0 auto 40px;
    }
    .google-btn {
      display: inline-flex; align-items: center; gap: 12px;
      background: #fff; color: #333;
      padding: 14px 28px; border-radius: var(--radius);
      font-size: 15px; font-weight: 600; cursor: pointer;
      border: none; transition: all 0.18s ease;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .google-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .features {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
      margin-top: 64px; text-align: left;
    }
    @media (max-width: 640px) {
      .features { grid-template-columns: 1fr; }
    }
    .feature-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
    }
    .feature-icon {
      font-size: 28px; margin-bottom: 12px; display: block;
    }
    .feature-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .feature-card p { font-size: 13px; color: var(--muted); }

    /* ── Dashboard ────────────────────────────────────────────────────────── */
    .dashboard { flex: 1; padding: 40px 0 80px; }

    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
      margin-bottom: 40px;
    }
    @media (max-width: 640px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 24px;
    }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 6px; }
    .stat-value { font-size: 28px; font-weight: 700; font-family: var(--mono); }

    /* ── Upload Card ──────────────────────────────────────────────────────── */
    .section-title {
      font-size: 18px; font-weight: 600; margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }

    .upload-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px; margin-bottom: 32px;
    }

    .drop-zone {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 48px 24px; text-align: center; cursor: pointer;
      transition: all 0.2s ease; position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent); background: rgba(108,71,255,0.06);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }
    .drop-icon { font-size: 48px; margin-bottom: 12px; display: block; }
    .drop-zone h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .drop-zone p { font-size: 13px; color: var(--muted); }

    .file-selected {
      display: flex; align-items: center; gap: 16px;
      background: rgba(108,71,255,0.08); border: 1px solid rgba(108,71,255,0.2);
      border-radius: var(--radius); padding: 16px 20px; margin-top: 20px;
    }
    .file-icon { font-size: 28px; flex-shrink: 0; }
    .file-info { flex: 1; min-width: 0; }
    .file-name { font-weight: 600; font-size: 14px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .file-size { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .settings-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px;
    }
    @media (max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } }
    .settings-grid .full { grid-column: 1 / -1; }

    label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--muted); margin-bottom: 8px;
    }
    input, select, textarea {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px;
      padding: 10px 14px; font-family: var(--font); font-size: 14px;
      transition: border-color 0.15s ease; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    select option { background: var(--surface); }

    .upload-btn-row {
      display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end;
    }

    /* ── Job Progress ─────────────────────────────────────────────────────── */
    .job-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
    }
    .job-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    .job-status-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-queued { background: var(--yellow); }
    .dot-running { background: var(--accent); animation: pulse 1.5s infinite; }
    .dot-completed { background: var(--green); }
    .dot-failed { background: var(--accent2); }

    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }

    .job-title { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; }
    .job-filename { color: var(--muted); font-size: 13px; margin-top: 2px; }

    .progress-bar-wrap {
      background: var(--surface); border-radius: 40px;
      height: 8px; overflow: hidden; margin-bottom: 10px;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 40px;
      background: linear-gradient(90deg, var(--accent), #a88fff);
      transition: width 0.4s ease;
    }
    .progress-bar-fill.complete { background: var(--green); }
    .progress-bar-fill.failed { background: var(--accent2); }

    .job-message { font-size: 13px; color: var(--muted); font-family: var(--mono); }

    .clips-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px; margin-top: 16px;
    }
    .clip-chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px;
      font-size: 12px;
    }
    .clip-chip.uploaded {
      border-color: rgba(0,229,160,0.3); background: rgba(0,229,160,0.05);
    }
    .clip-chip.failed {
      border-color: rgba(255,71,100,0.3); background: rgba(255,71,100,0.05);
    }
    .clip-title { font-weight: 600; margin-bottom: 4px; font-size: 12px; }
    .clip-url a {
      color: var(--accent); text-decoration: none; font-size: 11px;
      font-family: var(--mono);
    }
    .clip-url a:hover { text-decoration: underline; }
    .clip-status { margin-top: 4px; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .badge-green { background: rgba(0,229,160,0.15); color: var(--green); }
    .badge-yellow { background: rgba(255,204,0,0.15); color: var(--yellow); }
    .badge-red { background: rgba(255,71,100,0.15); color: var(--accent2); }
    .badge-purple { background: rgba(108,71,255,0.15); color: #a88fff; }

    /* ── Toast ────────────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 14px 20px; border-radius: var(--radius);
      font-size: 14px; font-weight: 500;
      box-shadow: var(--shadow); z-index: 9999;
      transform: translateY(80px); opacity: 0;
      transition: all 0.25s ease;
      max-width: 360px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-left: 3px solid var(--green); }
    #toast.error { border-left: 3px solid var(--accent2); }

    /* ── Tabs ─────────────────────────────────────────────────────────────── */
    .tabs {
      display: flex; gap: 4px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 4px; margin-bottom: 32px;
    }
    .tab {
      flex: 1; padding: 9px 16px; border-radius: 8px;
      font-family: var(--font); font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; background: transparent; color: var(--muted);
      transition: all 0.15s ease; text-align: center;
    }
    .tab.active {
      background: var(--card); color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .empty-state {
      text-align: center; padding: 64px 24px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; display: block; }
    .empty-state p { font-size: 15px; }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Video list ───────────────────────────────────────────────────────── */
    .video-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px;
      margin-bottom: 12px; transition: border-color 0.15s;
    }
    .video-row:hover { border-color: rgba(108,71,255,0.3); }
    .video-row-icon { font-size: 24px; flex-shrink: 0; }
    .video-row-info { flex: 1; min-width: 0; }
    .video-row-name { font-weight: 600; font-size: 14px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .video-row-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .video-row-actions { display: flex; gap: 8px; flex-shrink: 0; }
  </style>
</head>
<body>
<div class="app" id="app">

  <header>
    <div class="container">
      <div class="header-inner">
        <a href="/" class="logo">
          <div class="logo-icon">✂</div>
          Shorts<span>AI</span>
        </a>
        <div id="header-user"></div>
      </div>
    </div>
  </header>

  <main id="main"></main>

</div>

<div id="toast"></div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const API = '';  // Same origin
let currentUser = null;

// ─── Utilities ────────────────────────────────────────────────────────────────
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

function toast(msg, type = 'info') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 4000);
}

function fmt(bytes) {
  if (!bytes) return '0 B';
  const u = ['B','KB','MB','GB'];
  let i = 0; let b = bytes;
  while (b >= 1024 && i < 3) { b /= 1024; i++; }
  return `${b.toFixed(1)} ${u[i]}`;
}

function fmtDuration(secs) {
  if (!secs) return '—';
  const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = Math.floor(secs%60);
  if (h > 0) return `${h}h ${m}m ${s}s`;
  return `${m}m ${s}s`;
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ─── Auth ─────────────────────────────────────────────────────────────────────
async function checkAuth() {
  try {
    const data = await api('/api/auth/me');
    currentUser = data.email ? data : null;
    return !!currentUser;
  } catch {
    currentUser = null;
    return false;
  }
}

async function loginWithGoogle() {
  try {
    const { authUrl } = await api('/api/auth/google');
    window.location.href = authUrl;
  } catch(e) {
    toast('Could not get login URL: ' + e.message, 'error');
  }
}

async function logout() {
  await api('/api/auth/logout', { method: 'POST' });
  currentUser = null;
  renderApp();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderApp() {
  const main = $('#main');
  const headerUser = $('#header-user');

  if (!currentUser) {
    headerUser.innerHTML = '';
    main.innerHTML = renderHero();
    $('#login-btn').addEventListener('click', loginWithGoogle);
  } else {
    headerUser.innerHTML = `
      <div class="user-pill">
        <img src="${currentUser.picture}" alt="${currentUser.name}" />
        <span class="user-pill-name">${currentUser.name.split(' ')[0]}</span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign out</button>
      </div>`;
    main.innerHTML = renderDashboard();
    initDashboard();
  }
}

function renderHero() {
  return `
    <div class="hero">
      <div class="container">
        <div class="hero-badge">⚡ AI-Powered Shorts Engine</div>
        <h1>Turn any video into<br><span class="grad">YouTube Shorts</span></h1>
        <p>Upload a long video, we cut it into vertical Shorts and upload them directly to your YouTube channel.</p>
        <button class="google-btn" id="login-btn">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Sign in with Google
        </button>

        <div class="features">
          <div class="feature-card">
            <span class="feature-icon">✂️</span>
            <h3>Smart Cutting</h3>
            <p>FFmpeg auto-splits your video into Shorts-ready 60-second clips with proper 9:16 formatting.</p>
          </div>
          <div class="feature-card">
            <span class="feature-icon">🚀</span>
            <h3>Direct Upload</h3>
            <p>Each clip is uploaded directly to YouTube with #shorts tag for maximum reach.</p>
          </div>
          <div class="feature-card">
            <span class="feature-icon">📊</span>
            <h3>Live Progress</h3>
            <p>Real-time progress tracking from cutting to uploading. Watch your Shorts go live.</p>
          </div>
        </div>
      </div>
    </div>`;
}

function renderDashboard() {
  return `
    <div class="dashboard">
      <div class="container">
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">Videos Uploaded</div>
            <div class="stat-value">${currentUser.totalVideosUploaded || 0}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Shorts Created</div>
            <div class="stat-value" style="color:var(--accent)">${currentUser.totalShortsCreated || 0}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">YouTube Channel</div>
            <div style="font-size:13px; font-weight:600; margin-top:4px; color:var(--text)">
              ${currentUser.youtubeChannelName || '—'}
            </div>
          </div>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="upload">📤 Upload</button>
          <button class="tab" data-tab="jobs">⚙️ Jobs</button>
          <button class="tab" data-tab="history">📂 Videos</button>
        </div>

        <div id="panel-upload" class="panel active">${renderUploadPanel()}</div>
        <div id="panel-jobs" class="panel"></div>
        <div id="panel-history" class="panel"></div>
      </div>
    </div>`;
}

function renderUploadPanel() {
  return `
    <div class="upload-card">
      <div class="section-title"><div class="dot"></div> Upload a Video</div>

      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept="video/*" />
        <span class="drop-icon">🎬</span>
        <h3>Drop your video here</h3>
        <p>Supports MP4, AVI, MOV, MKV, WebM · Max 2 GB</p>
      </div>

      <div id="file-selected" style="display:none" class="file-selected">
        <span class="file-icon">🎞</span>
        <div class="file-info">
          <div class="file-name" id="sel-name">—</div>
          <div class="file-size" id="sel-size">—</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="clearFile()">✕ Remove</button>
      </div>

      <div class="settings-grid" style="margin-top:28px">
        <div>
          <label>Short Duration (seconds)</label>
          <select id="short-duration">
            <option value="30">30 seconds</option>
            <option value="60" selected>60 seconds (recommended)</option>
            <option value="45">45 seconds</option>
          </select>
        </div>
        <div>
          <label>Privacy</label>
          <select id="privacy">
            <option value="public">Public</option>
            <option value="unlisted">Unlisted</option>
            <option value="private">Private</option>
          </select>
        </div>
        <div class="full">
          <label>Shorts Title Prefix</label>
          <input type="text" id="title" placeholder="e.g. My Podcast Clip" value="YouTube Short" />
        </div>
        <div class="full">
          <label>Description</label>
          <textarea id="description" placeholder="Description for each Short (will add #shorts automatically)">Created with ShortsAI</textarea>
        </div>
        <div class="full">
          <label>Tags (comma-separated)</label>
          <input type="text" id="tags" placeholder="shorts, podcast, motivation" value="shorts, youtube" />
        </div>
      </div>

      <div class="upload-btn-row">
        <button class="btn btn-primary" id="upload-btn" onclick="handleUpload()">
          ✂️ Cut & Upload Shorts
        </button>
      </div>
    </div>

    <div id="active-job-area"></div>`;
}

// ─── Dashboard init ───────────────────────────────────────────────────────────
function initDashboard() {
  // Tabs
  $$('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      $$('.tab').forEach(t => t.classList.remove('active'));
      $$('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      const panel = $(`#panel-${tab.dataset.tab}`);
      panel.classList.add('active');
      if (tab.dataset.tab === 'jobs') loadJobs();
      if (tab.dataset.tab === 'history') loadHistory();
    });
  });

  // Drag-and-drop
  const dz = $('#drop-zone');
  if (dz) {
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) setFile(file);
    });
    $('#file-input').addEventListener('change', e => {
      if (e.target.files[0]) setFile(e.target.files[0]);
    });
  }
}

let selectedFile = null;

function setFile(file) {
  selectedFile = file;
  $('#file-selected').style.display = 'flex';
  $('#sel-name').textContent = file.name;
  $('#sel-size').textContent = fmt(file.size);
  $('#drop-zone').style.display = 'none';
}

function clearFile() {
  selectedFile = null;
  $('#file-selected').style.display = 'none';
  $('#drop-zone').style.display = 'flex';
  $('#file-input').value = '';
}

async function handleUpload() {
  if (!selectedFile) {
    toast('Please select a video file first.', 'error'); return;
  }

  const btn = $('#upload-btn');
  btn.disabled = true;

  const settings = {
    shortDuration: $('#short-duration').value,
    title: $('#title').value.trim() || 'YouTube Short',
    description: $('#description').value.trim(),
    tags: $('#tags').value.trim(),
    privacy: $('#privacy').value,
  };

  try {
    let video;
    const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB per chunk — well within Koyeb's timeout

    if (selectedFile.size > CHUNK_SIZE) {
      // ── Chunked upload for large files ────────────────────────────────────
      const uploadId = crypto.randomUUID();
      const totalChunks = Math.ceil(selectedFile.size / CHUNK_SIZE);

      for (let i = 0; i < totalChunks; i++) {
        const start = i * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, selectedFile.size);
        const chunk = selectedFile.slice(start, end);

        const pct = Math.round((i / totalChunks) * 90);
        btn.innerHTML = `<span class="spinner"></span> Uploading ${pct}% (${i+1}/${totalChunks})`;

        const fd = new FormData();
        fd.append('chunk', chunk);
        fd.append('uploadId', uploadId);
        fd.append('chunkIndex', i);
        fd.append('totalChunks', totalChunks);
        fd.append('filename', selectedFile.name);

        const r = await fetch('/api/videos/chunk', {
          method: 'POST', credentials: 'include', body: fd
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || `Chunk ${i+1} failed`);
      }

      // Assemble chunks into final video
      btn.innerHTML = '<span class="spinner"></span> Assembling...';
      const result = await fetch('/api/videos/assemble', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uploadId, ...settings })
      }).then(async r => {
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Assemble failed');
        return d;
      });
      video = result.video;

    } else {
      // ── Direct upload for small files (< 5MB) ─────────────────────────────
      btn.innerHTML = '<span class="spinner"></span> Uploading...';
      const fd = new FormData();
      fd.append('video', selectedFile);
      Object.entries(settings).forEach(([k,v]) => fd.append(k, v));

      const result = await fetch('/api/videos/upload', {
        method: 'POST', credentials: 'include', body: fd
      }).then(async r => {
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Upload failed');
        return d;
      });
      video = result.video;
    }

    toast(`✅ Uploaded! ~${video.estimatedClips || '?'} clips to create`, 'success');
    clearFile();
    btn.innerHTML = '✂️ Cut & Upload Shorts';
    btn.disabled = false;

    // Auto-start processing job
    const { jobId } = await api('/api/jobs/start', {
      method: 'POST',
      body: JSON.stringify({ videoId: video.id })
    });

    toast('🚀 Processing started!', 'success');
    showJobProgress(jobId, video);

  } catch(e) {
    toast(e.message, 'error');
    btn.innerHTML = '✂️ Cut & Upload Shorts';
    btn.disabled = false;
  }
}

function showJobProgress(jobId, videoInfo) {
  const area = $('#active-job-area');
  area.innerHTML = `
    <div class="job-card" id="job-${jobId}">
      <div class="job-header">
        <div class="job-status-dot dot-running"></div>
        <div>
          <div class="job-title">Processing: ${videoInfo?.originalFilename || 'Video'}</div>
          <div class="job-filename">Job ID: ${jobId}</div>
        </div>
        <span class="badge badge-purple">Running</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="pbar-${jobId}" style="width:0%"></div>
      </div>
      <div class="job-message" id="pmsg-${jobId}">Starting...</div>
      <div id="clips-${jobId}" class="clips-grid" style="margin-top:16px"></div>
    </div>`;

  // SSE connection
  const evtSrc = new EventSource(`/api/jobs/${jobId}/progress`, { withCredentials: true });

  evtSrc.onmessage = (e) => {
    const data = JSON.parse(e.data);
    const pbar = $(`#pbar-${jobId}`);
    const pmsg = $(`#pmsg-${jobId}`);
    const jobCard = $(`#job-${jobId}`);

    if (pbar) pbar.style.width = `${data.progress || 0}%`;
    if (pmsg) pmsg.textContent = data.message || '';

    if (data.status === 'completed') {
      evtSrc.close();
      if (pbar) pbar.classList.add('complete');
      if (jobCard) {
        const badge = jobCard.querySelector('.badge');
        if (badge) { badge.className = 'badge badge-green'; badge.textContent = 'Completed'; }
        const dot = jobCard.querySelector('.job-status-dot');
        if (dot) { dot.className = 'job-status-dot dot-completed'; }
      }
      if (data.result?.youtubeUrls?.length) {
        const clipsEl = $(`#clips-${jobId}`);
        if (clipsEl) {
          clipsEl.innerHTML = data.result.youtubeUrls.map((url, i) => `
            <div class="clip-chip uploaded">
              <div class="clip-title">Part ${i+1}</div>
              <div class="clip-url"><a href="${url}" target="_blank">▶ Watch on YouTube</a></div>
              <div class="clip-status"><span class="badge badge-green">✓ Live</span></div>
            </div>`).join('');
        }
      }
      toast(`🎉 ${data.result?.uploadedCount || ''} Shorts uploaded!`, 'success');
      // Refresh user stats
      api('/api/auth/me').then(u => {
        currentUser = u;
      }).catch(() => {});
    }

    if (data.status === 'failed') {
      evtSrc.close();
      if (pbar) pbar.classList.add('failed');
      if (jobCard) {
        const badge = jobCard.querySelector('.badge');
        if (badge) { badge.className = 'badge badge-red'; badge.textContent = 'Failed'; }
      }
      toast('❌ Job failed: ' + data.message, 'error');
    }
  };

  evtSrc.onerror = () => {
    evtSrc.close();
    toast('Lost connection to job — check Jobs tab.', 'error');
  };
}

async function loadJobs() {
  const panel = $('#panel-jobs');
  panel.innerHTML = '<div class="empty-state"><span class="icon">⏳</span><p>Loading jobs...</p></div>';

  try {
    const { jobs } = await api('/api/jobs');
    if (!jobs.length) {
      panel.innerHTML = '<div class="empty-state"><span class="icon">📭</span><p>No jobs yet. Upload a video to get started!</p></div>';
      return;
    }

    panel.innerHTML = jobs.map(j => {
      const statusClass = { queued:'yellow', running:'purple', completed:'green', failed:'red' }[j.status] || 'yellow';
      const dotClass = { queued:'dot-queued', running:'dot-running', completed:'dot-completed', failed:'dot-failed' }[j.status] || '';
      return `
        <div class="job-card">
          <div class="job-header">
            <div class="job-status-dot ${dotClass}"></div>
            <div style="flex:1; min-width:0">
              <div class="job-title">${j.videoId?.originalFilename || 'Video'}</div>
              <div class="job-filename">${fmtDate(j.createdAt)}</div>
            </div>
            <span class="badge badge-${statusClass}">${j.status}</span>
          </div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill ${j.status === 'completed' ? 'complete' : j.status === 'failed' ? 'failed' : ''}"
              style="width:${j.progress || 0}%"></div>
          </div>
          <div class="job-message">${j.message || ''}</div>
          ${j.result?.youtubeUrls?.length ? `
            <div class="clips-grid" style="margin-top:12px">
              ${j.result.youtubeUrls.map((url,i) => `
                <div class="clip-chip uploaded">
                  <div class="clip-title">Part ${i+1}</div>
                  <div class="clip-url"><a href="${url}" target="_blank">▶ YouTube</a></div>
                  <span class="badge badge-green">Live</span>
                </div>`).join('')}
            </div>` : ''}
        </div>`;
    }).join('');
  } catch(e) {
    panel.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

async function loadHistory() {
  const panel = $('#panel-history');
  panel.innerHTML = '<div class="empty-state"><span class="icon">⏳</span><p>Loading...</p></div>';

  try {
    const { videos } = await api('/api/videos');
    if (!videos.length) {
      panel.innerHTML = '<div class="empty-state"><span class="icon">📂</span><p>No videos uploaded yet.</p></div>';
      return;
    }

    const statusBadge = (s) => ({
      uploaded: '<span class="badge badge-yellow">Uploaded</span>',
      processing: '<span class="badge badge-purple">Processing</span>',
      cutting: '<span class="badge badge-purple">Cutting</span>',
      uploading: '<span class="badge badge-purple">Uploading</span>',
      completed: '<span class="badge badge-green">Completed</span>',
      failed: '<span class="badge badge-red">Failed</span>',
    }[s] || `<span class="badge">${s}</span>`);

    panel.innerHTML = `
      <div class="section-title"><div class="dot"></div> Uploaded Videos</div>
      ${videos.map(v => `
        <div class="video-row">
          <span class="video-row-icon">🎬</span>
          <div class="video-row-info">
            <div class="video-row-name">${v.originalFilename}</div>
            <div class="video-row-meta">${fmt(v.fileSize)} · ${fmtDuration(v.duration)} · ${v.totalClips || 0} clips · ${fmtDate(v.createdAt)}</div>
          </div>
          ${statusBadge(v.status)}
          <div class="video-row-actions">
            <button class="btn btn-danger btn-sm" onclick="deleteVideo('${v._id}')">🗑</button>
          </div>
        </div>`).join('')}`;
  } catch(e) {
    panel.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

async function deleteVideo(id) {
  if (!confirm('Delete this video and all its clips?')) return;
  try {
    await api(`/api/videos/${id}`, { method: 'DELETE' });
    toast('Video deleted', 'success');
    loadHistory();
  } catch(e) {
    toast(e.message, 'error');
  }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
(async () => {
  // Show loading state so page doesn't flash login screen
  $('#main').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:16px">
      <div class="spinner" style="width:32px;height:32px;border-width:3px"></div>
      <p style="color:var(--muted);font-size:14px">Loading...</p>
    </div>`;

  const params = new URLSearchParams(window.location.search);
  const justLoggedIn = params.get('login') === 'success';
  const loginError = params.get('error');

  if (justLoggedIn || loginError) {
    window.history.replaceState({}, '', '/');
  }

  // If coming back from OAuth, retry a few times to give session time to propagate
  let authed = false;
  const attempts = justLoggedIn ? 4 : 1;
  for (let i = 0; i < attempts; i++) {
    authed = await checkAuth();
    if (authed) break;
    if (i < attempts - 1) await new Promise(r => setTimeout(r, 600));
  }

  renderApp();

  if (justLoggedIn && authed) {
    toast('✅ Logged in successfully!', 'success');
  } else if (justLoggedIn && !authed) {
    toast('Session issue — please try signing in again.', 'error');
  }
  if (loginError) {
    toast('Login failed: ' + loginError, 'error');
  }
})();
</script>
